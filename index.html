    </head>
    <style>
        .emmm

        button

        }
        button:hover
        {

            color: #fff;
        }
        input

            padding: 5px;

    <body style="background-color: #75D3FF1A;">
        <table class="emmm" style="width: 98.4%;">
            <tr>
                <th>
                    <table>
                        <tr>
                            <th><img src="owo.webp" width="211" alt="头像"></th>
                            <th><h1><font color="#75D3FF">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cloux's </font><font color="#464646">blog</font></h1></th>
                        </tr>
                    </table>
                </th>
            </tr>
        </table>
        <button onclick="alert('邮箱:wo.bu.dao.a@outlook.com  qq:3819475378')">联系</button>&nbsp;<button>Ctrl+D 收藏</button>

        <br>
        <br>
        <br>
        <br>
        <br>

        <input type="text" placeholder="搜索文章" class="emmm" id="search-input">
        <br>
        <!--搜索结果-->
        <div id="search-results"></div>
        <hr>
        <!--文章列表-->
        <div id="article-list"></div>
        <!--/文章列表-->
        <hr>
        <center>© 2026 cloux.保留所有权利。</center>

        <script src="articles.js"></script>
        <script>
            // 从 article.txt 读取文章列表并渲染
            // 格式: 每行 "[标题](文件名)", 空行和 # 开头的注释行忽略
            function renderArticleList() {
                var listEl = document.getElementById('article-list');
                fetch('article.txt')
                    .then(function (res) { return res.text(); })
                    .then(function (text) {
                        var lines = text.split('\n');
                        var html = '';
                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i].trim();
                            if (!line || line.startsWith('#')) continue;
                            var m = line.match(/^\[(.+?)\]\((.+?)\)$/);
                            if (!m) continue;
                            var title = m[1];
                            var file = m[2];
                            var encoded = encodeURIComponent(file);
                            html += '<a href="article.html?file=' + encoded + '">' + escapeHtml(title) + '</a><br>\n';
                        }
                        listEl.innerHTML = html;
                    })
                    .catch(function (err) {
                        listEl.innerHTML = '<p style="color:#999;margin:10px;">列表加载失败（本地 file:// 打开时无法读取 article.txt，部署后或用本地服务器可正常显示）</p>';
                    });
            }
            renderArticleList();

            // 搜索功能: 在 owo/ 下所有 .md 内容里查找关键词
            function searchArticles() {
                var inputEl = document.getElementById('search-input');
                var resultsEl = document.getElementById('search-results');
                var keyword = inputEl.value.trim();
                if (!keyword) {
                    resultsEl.innerHTML = '';
                    return;
                }
                var articles = window.__ARTICLES__ || {};
                var results = [];
                var kwLower = keyword.toLowerCase();

                for (var file in articles) {
                    if (!articles.hasOwnProperty(file)) continue;
                    var content = articles[file];
                    // 标题: 文件名去掉 "日期 " 前缀和 .md 后缀
                    var title = file.replace(/^.*?\s/, '').replace(/\.md$/i, '');
                    // 按句子分割: 中英文标点 + 换行
                    var sentences = content.split(/[。\n!?.!?；;]/).filter(function (s) {
                        return s.trim().length > 0;
                    });
                    var matches = [];
                    for (var i = 0; i < sentences.length; i++) {
                        if (sentences[i].toLowerCase().indexOf(kwLower) !== -1) {
                            matches.push(sentences[i].trim());
                        }
                    }
                    if (matches.length > 0) {
                        results.push({ file: file, title: title, matches: matches });
                    }
                }

                if (results.length === 0) {
                    resultsEl.innerHTML = '<div class="search-empty">没有找到包含"' + escapeHtml(keyword) + '"的文章</div>';
                    return;
                }

                var html = '';
                for (var i = 0; i < results.length; i++) {
                    var r = results[i];
                    var encoded = encodeURIComponent(r.file);
                    var kwEncoded = encodeURIComponent(keyword);
                    var linkHref = 'article.html?file=' + encoded + '&kw=' + kwEncoded;
                    html += '<div class="search-result-item">';
                    html += '<a href="' + linkHref + '">' + escapeHtml(r.title) + '</a>';
                    for (var j = 0; j < r.matches.length; j++) {
                        html += '<p><a href="' + linkHref + '" style="color:inherit;text-decoration:none;">' + highlightKeyword(r.matches[j], keyword) + '</a></p>';
                    }
                    html += '</div>';
                }
                resultsEl.innerHTML = html;
            }

            function escapeHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function highlightKeyword(sentence, keyword) {
                var safe = escapeHtml(sentence);
                var re = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                return safe.replace(re, '<mark>$1</mark>');
            }

            // 输入自动搜索 (防抖 300ms)
            var searchDebounce = null;
            document.getElementById('search-input').addEventListener('input', function () {
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(searchArticles, 300);
            });
        </script>
    </body>
</html>
