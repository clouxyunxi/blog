  /*

  */
  .input
  {
    margin-bottom:3em;/*输入框与按钮之间的间距*/
    background-color:#ddeeff;/*输入框的背景颜色*/
    border-radius: 0.5em; /*输入框的圆角*/
    padding:1em; /*输入框的内边距*/
    border-style:solid;/*输入框的边框样式*/
    border-width: 2.5px; /*输入框的边框宽度*/
    border-color: #75D3FF;/*输入框的边框颜色*/
    color: #75D3FF;/*输入框的文本颜色*/
    font-size: 1em;/*输入框的字体大小*/
    width: 20em;/*输入框的宽度*/
    height: 2em;/*输入框的高度*/

  }
  .button
  {
    margin:1em;
    margin-bottom:3em;
    background-color:#ddeeff;
    border-radius: 0.5em; 
    padding:1em; 
    border-style:solid;
    border-width: 2.5px; 
    border-color: #75D3FF;
    color: #75D3FF;
  }
  .button:hover
  {
    background-color: rgb(110, 210, 250);
    color: #ffffff;
    padding: 1em;
    border: 2px solid rgb(110, 210, 250);
  }
  img
  {
    max-width: 100%;
    height: auto;
  }
  iframe
  {
    max-width: 100%;
  }

  /* 手机端适配 */
  @media screen and (max-width: 768px) {
    body
    {
      font-size: 16px;
    }
    .emmm
    {
      margin: 0.5em;
      margin-bottom: 1.5em;
      padding: 0.75em;
    }
    /* 表格转为竖向堆叠布局 */
    table, tbody, tr, td, th
    {
      display: block;
      width: 100% !important;
      box-sizing: border-box;
      text-align: center;
    }
    table
    {
      margin: 0;
    }
    td, th
    {
      padding: 0.25em 0;
    }
    /* 头像大小调整 */
    .emmm img
    {
      width: 180px;
      max-width: 60vw;
    }
    /* 标题去除多余空格 */
    .emmm h1
    {
      margin: 0.5em 0;
    }
    /* 移除占位用的空单元格 */
    .emmm table td:empty
    {
      display: none;
    }
    /* 输入框宽度自适应 */
    .input
    {
      width: 100%;
      max-width: 20em;
      box-sizing: border-box;
    }
    /* 按钮居中 */
    .button
    {
      display: inline-block;
      margin: 0.5em;
    }
    /* 底部右下角 iframe 居中 */
    div[style*="text-align: right"]
    {
      text-align: center !important;
    }
    div[style*="text-align: right"] iframe
    {
      width: 100%;
      max-width: 360px;
    }
  }
</style>
