        <!--
        <a href="https://wapmz.com/in/297"><img src="https://wapmz.com/cn/big/297" alt="wapmz.com"></a><br>
        <img src="https://count.himiku.com/@jjtt.org?name=jjtt.org&theme=moebooru&padding=7&offset=0&align=bottom&scale=1&pixelated=1&darkmode=auto" alt="计数器owo">
        -->
        <script>
            // 异步加载文章列表 + 内容（直接从 owo/ 读取 .md 文件，不再依赖 articles.js 缓存）
            var __ARTICLES_CACHE__ = null;
            function loadArticles() {
                if (__ARTICLES_CACHE__) return Promise.resolve(__ARTICLES_CACHE__);
                var entries = [];
                return fetch('article.txt')
                    .then(function (res) { return res.text(); })
                    .then(function (text) {
                        var lines = text.split('\n');
                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i].trim();
                            if (!line || line.startsWith('#')) continue;
                            // 格式: [标题](文件名)日期   如: [测试文档](测试文档.md)2026-8-17
                            var m = line.match(/^\[(.+?)\]\((.+?)\)(\d{4}-\d{1,2}-\d{1,2})\s*$/);
                            if (!m) continue;
                            entries.push({ title: m[1], file: m[2], date: m[3], content: '' });
                        }
                        // 并行 fetch 所有 .md 内容
                        return Promise.all(entries.map(function (e) {
                            return fetch('owo/' + encodeURIComponent(e.file))
                                .then(function (res) { return res.text(); })
                                .then(function (c) { e.content = c; return e; })
                                .catch(function () { e.content = ''; return e; });
                        }));
                    })
                    .then(function (results) {
                        __ARTICLES_CACHE__ = results;
                        return results;
                    });
            }

            // 从 article.txt 读取文章列表并渲染
            // 格式: 每行 "[标题](文件名)", 空行和 # 开头的注释行忽略
            function renderArticleList() {
                var listEl = document.getElementById('article-list');
                loadArticles()
                    .then(function (entries) {
                        var html = '';
                        for (var i = 0; i < entries.length; i++) {
                            var e = entries[i];
                            var encoded = encodeURIComponent(e.file);
                            var dateParam = e.date ? ('&date=' + encodeURIComponent(e.date)) : '';
                            // 标题和第一句话整体作为一个链接
                            html += '<a href="article.html?file=' + encoded + dateParam + '" style="display:block;margin:3px 0;">';
                            html += escapeHtml(e.title);
                            // 在标题下方显示文章第一句话
                            if (e.content) {
                                var firstSentence = getFirstSentence(e.content);
                                if (firstSentence) {
                                    html += '<div style="margin:2px 0 0 16px;color:#666;font-size:0.95em;">' + escapeHtml(firstSentence) + '</div>';
                                }
                            }
                            html += '</a>\n';
                        }
                        listEl.innerHTML = html;
                    })
                    .catch(function (err) {
                        listEl.innerHTML = '<p style="color:#999;margin:10px;">列表加载失败（本地 file:// 打开时无法读取 article.txt，部署后或用本地服务器可正常显示）</p>';
                    });
            }
            renderArticleList();

            // 提取文章第一句话（限制在一行以内）
            function getFirstSentence(content) {
                // 跳过 markdown 标题行 (# 开头)
                var text = content.replace(/^#.*$/gm, '').trim();
                // 按中英文标点和换行分割句子
                var sentences = text.split(/[。\n!?.!?；;]/).filter(function (s) {
                    return s.trim().length > 0;
                });
                if (sentences.length === 0) return '';
                var s = sentences[0].trim();
                // 限制为一行长度
                if (s.length > 60) {
                    s = s.substring(0, 60) + '...';
                }
                return s;
            }

            // 搜索功能: 在 owo/ 下所有 .md 内容里查找关键词
            function searchArticles() {
                var inputEl = document.getElementById('search-input');
                var resultsEl = document.getElementById('search-results');
                var keyword = inputEl.value.trim();
                if (!keyword) {
                    resultsEl.innerHTML = '';
                    return;
                }
                loadArticles().then(function (entries) {
                    var results = [];
                    var kwLower = keyword.toLowerCase();

                    for (var i = 0; i < entries.length; i++) {
                        var e = entries[i];
                        var content = e.content || '';
                        // 按句子分割: 中英文标点 + 换行
                        var sentences = content.split(/[。\n!?.!?；;]/).filter(function (s) {
                            return s.trim().length > 0;
                        });
                        var matches = [];
                        for (var j = 0; j < sentences.length; j++) {
                            if (sentences[j].toLowerCase().indexOf(kwLower) !== -1) {
                                matches.push(sentences[j].trim());
                            }
                        }
                        if (matches.length > 0) {
                            results.push({ file: e.file, title: e.title, date: e.date, matches: matches });
                        }
                    }

                    if (results.length === 0) {
                        resultsEl.innerHTML = '<div class="search-empty">没有找到包含"' + escapeHtml(keyword) + '"的文章</div>';
                        return;
                    }

                    var html = '';
                    for (var k = 0; k < results.length; k++) {
                        var r = results[k];
                        var encoded = encodeURIComponent(r.file);
                        var kwEncoded = encodeURIComponent(keyword);
                        var dateParam = r.date ? ('&date=' + encodeURIComponent(r.date)) : '';
                        var linkHref = 'article.html?file=' + encoded + '&kw=' + kwEncoded + dateParam;
                        html += '<div class="search-result-item">';
                        html += '<a href="' + linkHref + '">' + escapeHtml(r.title) + '</a>';
                        for (var m = 0; m < r.matches.length; m++) {
                            html += '<p><a href="' + linkHref + '" style="color:inherit;text-decoration:none;">' + highlightKeyword(r.matches[m], keyword) + '</a></p>';
                        }
                        html += '</div>';
                    }
                    resultsEl.innerHTML = html;
                });
            }

            function escapeHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function highlightKeyword(sentence, keyword) {
                var safe = escapeHtml(sentence);
                var re = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                return safe.replace(re, '<mark>$1</mark>');
            }

            // 输入自动搜索 (防抖 300ms)
            var searchDebounce = null;
            document.getElementById('search-input').addEventListener('input', function () {
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(searchArticles, 300);
            });
        </script>
